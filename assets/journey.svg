<circle r="5" fill="#fff" filter="url(#gw)" opacity="0"><set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/><animateMotion dur="5s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".5 0 .5 1"><mpath href="#jp"/></animateMotion></circle>

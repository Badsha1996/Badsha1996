<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Career timeline from 2019 intern to 2026 tech lead and IIT Patna M.Tech">
<style>
.dr{stroke-dasharray:1035.9;stroke-dashoffset:1035.9;animation:draw 2.6s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.n{opacity:0;animation:pop .6s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.dr{animation:none;stroke-dashoffset:0}.n{animation:none;opacity:1}.ring{animation:none;opacity:0}}
</style>
<defs><linearGradient id="jb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#0E1433"/></linearGradient>
